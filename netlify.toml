[build]
  base = "."
  command = "npm ci --prefix apps/api && npm run typecheck --prefix apps/api && npm test --prefix apps/api && node scripts/build-site.mjs"
  publish = "dist"
  functions = "apps/api/src/functions"
  # Skip builds for commits that only touch documentation, tasks, contracts or
  # provider source data, so docs PRs do not consume paid deploy credits (MVP_DECISIONS D-09).
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Files read at runtime (not import-bundled) must ship with the functions. B-011a reads the consent
  # version list with createRequire(), which esbuild does not inline (scripts/check-functions-runtime.mjs).
  included_files = ["contracts/legal/consent-versions.json"]

# Deploy Previews may use the frontend mock adapter; every other context calls the real API.
[context.deploy-preview.environment]
  VITE_KAREO_API_MODE = "mock"

[[redirects]]
  from = "/api/v1/session"
  to = "/.netlify/functions/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/consent"
  to = "/.netlify/functions/consent"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/assessments"
  to = "/.netlify/functions/assessment"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/external-services/transportation"
  to = "/.netlify/functions/externalServiceTransportation"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/providers/*"
  to = "/.netlify/functions/providerDetail"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/knowledge/status"
  to = "/.netlify/functions/knowledgeStatus"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/recommendations"
  to = "/.netlify/functions/recommendations"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/session"
  to = "/.netlify/functions/adminSession"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/status"
  to = "/.netlify/functions/adminKnowledgeStatus"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/changes"
  to = "/.netlify/functions/adminKnowledgeChanges"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/changes/:changeId/dismiss"
  to = "/.netlify/functions/adminKnowledgeChangeDismiss"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/records"
  to = "/.netlify/functions/adminKnowledgeRecords"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/records/:recordId/decision"
  to = "/.netlify/functions/adminKnowledgeRecordDecision"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/publish-preview"
  to = "/.netlify/functions/adminKnowledgePublishPreview"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/publish"
  to = "/.netlify/functions/adminKnowledgePublish"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/restorable-versions"
  to = "/.netlify/functions/adminKnowledgeRestorableVersions"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/admin/knowledge/withdraw"
  to = "/.netlify/functions/adminKnowledgeWithdraw"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/api-not-found.json"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/kareo-version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
