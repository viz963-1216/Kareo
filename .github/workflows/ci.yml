# TASK-J-003 PR CI. Runs real builds/tests with no secrets.
# `pull_request` (not `pull_request_target`) so fork PRs never receive repository secrets.
# Deploys and paid AI smoke tests are NOT triggered here (see docs/INTEGRATION_ACCEPTANCE.md).
name: CI

on:
  pull_request:
    branches: [staging, release, main]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm run typecheck --prefix apps/api
      - run: npm test --prefix apps/api
      - name: Built functions load and run (esbuild bundle + netlify.toml included_files)
        run: node scripts/check-functions-runtime.mjs

  web:
    name: Frontend build (real API mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Frontend module regression tests (including C-005)
        run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
      - name: Real-mode bundle must not contain mock fixtures
        run: |
          if grep -R -l -E 'SES-MOCK|CON-MOCK|ASM-MOCK|KB-MOCK|PROV-MOCK|REC-MOCK|LEAD-MOCK' apps/web/dist; then
            echo "::error::Production bundle contains mock data"; exit 1
          fi

  site:
    name: Netlify site bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - run: test -f dist/index.html && test -f dist/api-not-found.json

  contracts-and-data:
    name: Routes, contracts, knowledge packs, provider data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Netlify routes / mock contracts / forbidden fields / endpoint coverage
        run: node scripts/check-integration.mjs
      - name: Admin fixture consistency (J-002 v0.4)
        run: node contracts/mock/admin/validate-fixtures.mjs
      - name: Knowledge content packs
        run: node scripts/validate-knowledge-pack.mjs .
      - name: Provider data gate (TASK-A-004)
        run: node scripts/check-provider-data.mjs
      - name: Provider coordinate evidence and immutable resource inventory
        run: |
          node data/providers/qa/verify-coordinates.mjs
          node data/providers/qa/resource-center-report.mjs
          node data/providers/qa/verify-official-catalog.mjs
          node --test data/providers/qa/tests/*.test.mjs

  script-tests:
    name: Adapter, deploy-ignore and gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test "tests/**/*.test.*"
      - name: Release smoke safety tests (J-004)
        run: node --test scripts/tests/smoke-release.test.mjs scripts/tests/cleanup-staging.test.mjs

  acceptance-dev:
    name: Acceptance (dev check — PENDING allowed, not MVP acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      # esbuild for the built-functions items of the gate
      - run: npm ci --prefix apps/api
      - run: node scripts/acceptance-gate.mjs --mode=dev

  # Local isolated PostgreSQL (PGlite): all migrations in order (fresh and as an upgrade from 0008 with existing
  # published knowledge), RLS／privileges, Provider import rollback, knowledge publish／withdraw, the deployed
  # knowledge read path (apps/api repository + resolver via supabase-js and a GET-only PostgREST shim), crawler
  # snapshot read-back, recommendation write atomicity. Since J-003-r8 a DB FAIL fails this job (no
  # continue-on-error; `shell: bash` gives `-eo pipefail`, so `tee` cannot hide it); every check passed fresh and
  # upgrade on staging 6abe494. Whether a red job blocks merging depends on branch protection, which is a GitHub
  # setting outside this file (none on staging／main as of 2026-09-29).
  # Still a local database, not the staging Supabase or a deployment.
  db-verify:
    name: Isolated DB verification
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the negative control reads c5d4cb4^ from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/db/package-lock.json
            apps/api/package-lock.json
      - run: npm ci --prefix tests/db
      - name: Application restore negative controls (J-004)
        run: node --test scripts/tests/restore-app-snapshot.test.mjs
      # esbuild + supabase-js: K10–K12, U5 and C3 bundle and run the real API repository.
      - run: npm ci --prefix apps/api
      - name: Fresh database
        run: node tests/db/verify-db.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upgrade path from 0008 with existing data
        if: always()
        run: node tests/db/verify-db.mjs --upgrade-from=0008 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: K10 detects the retired reader (repository before B-008-r5 c5d4cb4)
        if: always()
        run: |
          git show c5d4cb4^:apps/api/src/repositories/supabaseKnowledgeRepository.ts > "$RUNNER_TEMP/legacy-repo.ts"
          if node tests/db/verify-db.mjs --knowledge-repository-from="$RUNNER_TEMP/legacy-repo.ts" > "$RUNNER_TEMP/legacy.log"; then
            cat "$RUNNER_TEMP/legacy.log"; echo "::error::verify-db passed with the known-bad reader"; exit 1
          fi
          grep -E '^FAIL +K10 ' "$RUNNER_TEMP/legacy.log" || { cat "$RUNNER_TEMP/legacy.log"; echo "::error::K10 did not fail on the known-bad reader"; exit 1; }

  postgres-concurrency:
    name: Real PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kareo_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: kareo_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KAREO_TEST_PG_URL: postgresql://kareo_test:synthetic-ci-only@127.0.0.1:5432/kareo_concurrency_test
      KAREO_TEST_PG_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/db/package-lock.json
      - run: npm ci --prefix tests/db
      - name: Destructive verifier rejects remote databases and URI overrides
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          for (const url of [
            'postgresql://kareo_test:synthetic-ci-only@example.invalid/kareo_concurrency_test',
            'postgresql://kareo_test:synthetic-ci-only@127.0.0.1:5432/kareo_concurrency_test?host=example.invalid',
            'postgresql://kareo_test:synthetic-ci-only@127.0.0.1:5432/other_database',
            'postgresql://other_user:synthetic-ci-only@127.0.0.1:5432/kareo_concurrency_test',
          ]) {
            const result = spawnSync(process.execPath, ['tests/db/verify-concurrency.mjs'], {
              env: { ...process.env, KAREO_TEST_PG_URL: url }, encoding: 'utf8', timeout: 5000,
            });
            assert.equal(result.status, 1);
            assert.match(result.stderr, /^FAIL PG-CONCURRENCY CONFIG_REJECTED$/m);
            assert.doesNotMatch(result.stdout, /^PASS PG-M1 /m);
          }
          console.log('PASS: four unsafe configurations rejected before database initialization');
          JS
      - name: Independent backend locking and stale-state rejection
        run: node tests/db/verify-concurrency.mjs
      - name: Counterexample must fail when the CLI publisher uses a different mutex
        run: |
          if node tests/db/verify-concurrency.mjs --negative-control=wrong-publish-lock > "$RUNNER_TEMP/concurrency-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/concurrency-negative.log"
            echo "::error::Concurrency verifier accepted a publisher with the wrong shared lock"; exit 1
          fi
          grep '^PASS PG-M1 ' "$RUNNER_TEMP/concurrency-negative.log"
          grep '^FAIL PG-CONCURRENCY SHARED_LOCK_NOT_OBSERVED$' "$RUNNER_TEMP/concurrency-negative.log"
      - name: Counterexample must expose the retired Consent-first withdrawal deadlock
        run: |
          if node tests/db/verify-concurrency.mjs --negative-control=old-withdraw-lock-order > "$RUNNER_TEMP/withdraw-order-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/withdraw-order-negative.log"
            echo "::error::Concurrency verifier accepted the inverse withdrawal lock order"; exit 1
          fi
          grep '^PASS PG-M1 ' "$RUNNER_TEMP/withdraw-order-negative.log"
          grep '^FAIL PG-CONCURRENCY DEADLOCK_OBSERVED$' "$RUNNER_TEMP/withdraw-order-negative.log"
