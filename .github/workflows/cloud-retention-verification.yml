name: Acceptance cloud deletion journal verification

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Create/delete one no-health acceptance Session and simulate restoring only that row'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kareo-staging-retention-cleanup
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'viz963-1216/Kareo' && github.ref == 'refs/heads/staging' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KAREO_OPERATOR_KEY: ${{ secrets.KAREO_OPERATOR_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      KAREO_OPERATOR_ID: OP-SU-ZIJIE-ACCEPTANCE
      NETLIFY_SITE_ID: faeb21e1-94d1-4d42-bbbc-6f9692caaef9
      KAREO_CLOUD_RETENTION_CONFIRM: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm run build --prefix apps/api
      - name: Verify real cloud SDK, deletion, cleanup and synthetic row replay
        run: node scripts/verify-cloud-retention.mjs
      - name: Preserve sanitized operational evidence (never an E2E result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-cloud-retention-evidence
          path: work/cloud-retention-evidence.json
          if-no-files-found: warn
          retention-days: 7
