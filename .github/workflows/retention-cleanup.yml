name: Staging retention cleanup

on:
  schedule:
    - cron: '30 16 * * *' # 00:30 Asia/Taipei; independent of the knowledge crawler.
  workflow_dispatch:
    inputs:
      commit:
        description: 'Apply approved retention rules (otherwise authenticated dry-run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kareo-staging-retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # Enable only after Jerry has explicitly delegated this operation and the
    # protected staging environment contains that individual's credentials.
    # No pull_request trigger; untrusted PRs cannot request privileged cleanup.
    if: github.repository == 'viz963-1216/Kareo' && github.ref == 'refs/heads/staging' && (github.event_name == 'workflow_dispatch' || vars.KAREO_RETENTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KAREO_OPERATOR_KEY: ${{ secrets.KAREO_OPERATOR_KEY }}
      KAREO_OPERATOR_ID: ${{ vars.KAREO_OPERATOR_ID }}
      # Outside Netlify Functions there is no automatic Blobs context. The
      # steward must explicitly delegate this access; missing access fails closed.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm run build --prefix apps/api
      - name: Run the protected cleanup CLI (no private data in output)
        env:
          CLEANUP_MODE: ${{ github.event_name == 'schedule' && 'commit' || inputs.commit && 'commit' || 'dry-run' }}
        run: node scripts/cleanup-staging.mjs --mode="$CLEANUP_MODE"
      - name: Failure notice
        if: failure()
        run: echo "::error::Acceptance retention cleanup failed. Jerry must inspect DeletionRun and retry before the seven-day deletion deadline; this run is not success evidence."
