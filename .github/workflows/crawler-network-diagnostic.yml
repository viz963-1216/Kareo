# Read-only source connectivity diagnosis. No environment, credentials, data writes or crawler PASS.
name: Official source network diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the two failed approved New Taipei sources (no database access)
        run: node scripts/diagnose-crawler-network.mjs
